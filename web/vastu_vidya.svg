<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Vaasthu Vidya Mandala">
  <defs>
    <linearGradient id="vvbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBEFCF"/>
      <stop offset="0.55" stop-color="#F3DDA6"/>
      <stop offset="1" stop-color="#E7C57E"/>
    </linearGradient>
    <linearGradient id="vvgold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B8860B"/>
      <stop offset="1" stop-color="#8B6000"/>
    </linearGradient>
  </defs>

  <!-- Parchment-gold backdrop -->
  <rect x="0" y="0" width="200" height="200" fill="url(#vvbg)"/>

  <!-- Vastu Purusha Mandala: 3x3 padavinyasa grid -->
  <g fill="none" stroke="url(#vvgold)" stroke-width="3">
    <rect x="24" y="24" width="152" height="152" rx="4"/>
  </g>
  <g fill="none" stroke="#9A6E10" stroke-width="1.6" opacity="0.85">
    <line x1="24" y1="74.7" x2="176" y2="74.7"/>
    <line x1="24" y1="125.3" x2="176" y2="125.3"/>
    <line x1="74.7" y1="24" x2="74.7" y2="176"/>
    <line x1="125.3" y1="24" x2="125.3" y2="176"/>
  </g>

  <!-- Rotated square forming the 8-direction star -->
  <rect x="55" y="55" width="90" height="90" transform="rotate(45 100 100)"
        fill="none" stroke="url(#vvgold)" stroke-width="2.4"/>

  <!-- Diagonals of the central Brahmasthana -->
  <g stroke="#B8860B" stroke-width="1.2" opacity="0.7">
    <line x1="74.7" y1="74.7" x2="125.3" y2="125.3"/>
    <line x1="125.3" y1="74.7" x2="74.7" y2="125.3"/>
  </g>

  <!-- Central Brahmasthana (bindu) -->
  <circle cx="100" cy="100" r="17" fill="none" stroke="url(#vvgold)" stroke-width="2.6"/>
  <circle cx="100" cy="100" r="6" fill="url(#vvgold)"/>

  <!-- Directional markers (N E S W) -->
  <g fill="#8B6000">
    <circle cx="100" cy="34" r="3.4"/>
    <circle cx="166" cy="100" r="3.4"/>
    <circle cx="100" cy="166" r="3.4"/>
    <circle cx="34" cy="100" r="3.4"/>
  </g>
  <g font-family="Georgia, serif" font-size="13" font-weight="700" fill="#7A5600" text-anchor="middle">
    <text x="100" y="20">N</text>
    <text x="188" y="105">E</text>
    <text x="100" y="196">S</text>
    <text x="12" y="105">W</text>
  </g>
</svg>
